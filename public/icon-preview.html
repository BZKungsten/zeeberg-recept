<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ikon-förslag</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #e8e8e8; font-family: -apple-system, sans-serif; padding: 32px 16px; }
    h1 { text-align: center; font-size: 18px; color: #333; margin-bottom: 32px; font-weight: 600; }
    .grid { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; }
    .card { background: white; border-radius: 24px; padding: 24px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.10); width: 220px; }
    .card h2 { font-size: 13px; color: #888; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
    .card p { font-size: 16px; color: #333; font-weight: 700; margin-bottom: 20px; }
    .sizes { display: flex; align-items: flex-end; justify-content: center; gap: 20px; }
    .size-block { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .size-label { font-size: 10px; color: #aaa; }
    svg { display: block; }
  </style>
</head>
<body>
  <h1>Välj en appikon — öppna i Safari på telefonen för bästa förhandsvisning</h1>
  <div class="grid">

    <!-- OPTION 1: GRYTA -->
    <div class="card">
      <h2>Alternativ 1</h2>
      <p>Gryta</p>
      <div class="sizes">
        <div class="size-block">
          <svg width="120" height="120" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" rx="22" fill="#6B8C6B"/>
            <g stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M 47 38 Q 46 30 50 28 Q 54 30 53 38"/>
              <path d="M 25 52 Q 25 34 50 31 Q 75 34 75 52"/>
              <line x1="22" y1="52" x2="78" y2="52"/>
              <path d="M 25 52 Q 22 74 50 76 Q 78 74 75 52"/>
              <path d="M 25 57 Q 14 57 14 65 Q 14 73 25 73"/>
              <path d="M 75 57 Q 86 57 86 65 Q 86 73 75 73"/>
            </g>
          </svg>
          <span class="size-label">120 px</span>
        </div>
        <div class="size-block">
          <svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" rx="22" fill="#6B8C6B"/>
            <g stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M 47 38 Q 46 30 50 28 Q 54 30 53 38"/>
              <path d="M 25 52 Q 25 34 50 31 Q 75 34 75 52"/>
              <line x1="22" y1="52" x2="78" y2="52"/>
              <path d="M 25 52 Q 22 74 50 76 Q 78 74 75 52"/>
              <path d="M 25 57 Q 14 57 14 65 Q 14 73 25 73"/>
              <path d="M 75 57 Q 86 57 86 65 Q 86 73 75 73"/>
            </g>
          </svg>
          <span class="size-label">60 px</span>
        </div>
      </div>
    </div>

    <!-- OPTION 2: BESTICK -->
    <div class="card">
      <h2>Alternativ 2</h2>
      <p>Gaffel &amp; kniv</p>
      <div class="sizes">
        <div class="size-block">
          <svg width="120" height="120" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" rx="22" fill="#6B8C6B"/>
            <g stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="33" y1="22" x2="33" y2="44"/>
              <line x1="40" y1="22" x2="40" y2="44"/>
              <line x1="47" y1="22" x2="47" y2="44"/>
              <path d="M 33 44 Q 32 54 40 56 Q 48 54 47 44"/>
              <line x1="40" y1="56" x2="40" y2="78"/>
              <line x1="61" y1="22" x2="61" y2="78"/>
              <path d="M 61 22 Q 74 28 72 50 Q 70 59 61 61"/>
            </g>
          </svg>
          <span class="size-label">120 px</span>
        </div>
        <div class="size-block">
          <svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" rx="22" fill="#6B8C6B"/>
            <g stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="33" y1="22" x2="33" y2="44"/>
              <line x1="40" y1="22" x2="40" y2="44"/>
              <line x1="47" y1="22" x2="47" y2="44"/>
              <path d="M 33 44 Q 32 54 40 56 Q 48 54 47 44"/>
              <line x1="40" y1="56" x2="40" y2="78"/>
              <line x1="61" y1="22" x2="61" y2="78"/>
              <path d="M 61 22 Q 74 28 72 50 Q 70 59 61 61"/>
            </g>
          </svg>
          <span class="size-label">60 px</span>
        </div>
      </div>
    </div>

    <!-- OPTION 3: KOCKMÖSSA -->
    <div class="card">
      <h2>Alternativ 3</h2>
      <p>Kockmössa</p>
      <div class="sizes">
        <div class="size-block">
          <svg width="120" height="120" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" rx="22" fill="#6B8C6B"/>
            <g stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M 26 73 L 26 65 Q 26 58 50 58 Q 74 58 74 65 L 74 73 Q 74 80 50 80 Q 26 80 26 73 Z"/>
              <path d="M 33 62 Q 30 48 30 38 Q 29 17 50 14 Q 71 17 70 38 Q 70 48 67 62"/>
            </g>
          </svg>
          <span class="size-label">120 px</span>
        </div>
        <div class="size-block">
          <svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" rx="22" fill="#6B8C6B"/>
            <g stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M 26 73 L 26 65 Q 26 58 50 58 Q 74 58 74 65 L 74 73 Q 74 80 50 80 Q 26 80 26 73 Z"/>
              <path d="M 33 62 Q 30 48 30 38 Q 29 17 50 14 Q 71 17 70 38 Q 70 48 67 62"/>
            </g>
          </svg>
          <span class="size-label">60 px</span>
        </div>
      </div>
    </div>

    <!-- OPTION 4: STEKPANNA -->
    <div class="card">
      <h2>Alternativ 4</h2>
      <p>Stekpanna</p>
      <div class="sizes">
        <div class="size-block">
          <svg width="120" height="120" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" rx="22" fill="#6B8C6B"/>
            <g stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="42" cy="57" r="25"/>
              <line x1="66" y1="48" x2="84" y2="28"/>
              <line x1="66" y1="66" x2="84" y2="72"/>
              <path d="M 84 28 Q 90 50 84 72"/>
            </g>
          </svg>
          <span class="size-label">120 px</span>
        </div>
        <div class="size-block">
          <svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" rx="22" fill="#6B8C6B"/>
            <g stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="42" cy="57" r="25"/>
              <line x1="66" y1="48" x2="84" y2="28"/>
              <line x1="66" y1="66" x2="84" y2="72"/>
              <path d="M 84 28 Q 90 50 84 72"/>
            </g>
          </svg>
          <span class="size-label">60 px</span>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
